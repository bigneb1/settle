<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settle</title>
    <script>
      // Runs before first paint to avoid a dark-theme flash for users who
      // previously chose light mode (ThemeSwitcher's effect runs too late).
      if (localStorage.getItem('settle-theme') === 'light') {
        document.documentElement.classList.remove('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
