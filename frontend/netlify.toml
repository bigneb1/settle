# Netlify config for the Settle frontend (Vite SPA).
# Build from the frontend/ directory (set Root Directory = frontend in Netlify UI,
# or run `netlify deploy` from this directory).

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — every client-side route (e.g. /dashboard, /catalog) must serve
# index.html so direct loads and refreshes don't 404. `force = true` makes the
# SPA rule take precedence over static-file matching.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Long-cache the hashed Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
